<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teleprompter IDD — gravação de Shorts</title>
<style>
  :root { --bg: #0b1120; --fg: #f8fafc; --dim: #64748b; --acc: #fde68a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Segoe UI", system-ui, sans-serif; height: 100vh; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; overflow: hidden; }
  header { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 14px; background: #111827; border-bottom: 1px solid #1f2937; font-size: 14px; }
  header select, header input, header button { background: #1f2937; color: var(--fg); border: 1px solid #334155; border-radius: 6px; padding: 5px 8px; font: inherit; }
  header button { cursor: pointer; }
  header button.rec { background: #b91c1c; border-color: #ef4444; font-weight: 600; }
  header .help { color: var(--dim); margin-left: auto; }
  #prompter { position: relative; overflow: hidden; padding: 0 6vw; }
  #track { position: absolute; left: 6vw; right: 6vw; top: 0; transition: transform .6s ease; }
  .par { font-size: var(--fs, 46px); line-height: 1.35; margin: 0 0 1.1em; color: #475569; transition: color .3s; }
  .par.atual { color: var(--fg); }
  .par .tela { display: block; font-size: .45em; color: var(--acc); margin-top: .3em; }
  .pausa { color: #38bdf8; }
  #guia { position: absolute; left: 0; right: 0; top: 18px; height: 4px; background: linear-gradient(90deg, transparent, #ef4444, transparent); opacity: .7; }
  aside { padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; border-left: 1px solid #1f2937; background: #0f172a; }
  #saida { height: calc(100vh - 140px); aspect-ratio: 9 / 16; background: #000; border-radius: 10px; border: 2px solid #1f2937; }
  #saida.gravando { border-color: #ef4444; }
  #status { font-size: 14px; color: var(--dim); text-align: center; max-width: 320px; }
  #contagem { position: fixed; inset: 0; display: none; place-items: center; font-size: 30vh; font-weight: 800; background: rgba(0,0,0,.55); z-index: 9; }
  #livre { display: none; position: fixed; inset: 10vh 15vw; z-index: 8; background: #111827; border: 1px solid #334155; border-radius: 10px; padding: 16px; flex-direction: column; gap: 10px; }
  #livre textarea { flex: 1; background: #0b1120; color: var(--fg); border: 1px solid #334155; border-radius: 6px; padding: 10px; font: 16px/1.5 "Segoe UI", sans-serif; }
  #downloads a { color: #38bdf8; display: block; font-size: 13px; }
</style>
</head>
<body>
<header>
  <label>Roteiro <select id="roteiro"></select></label>
  <label>Modo <select id="modo"><option value="camera">Câmera + voz</option><option value="voz">Só voz</option></select></label>
  <label>Velocidade <input id="wpm" type="number" min="80" max="260" step="10" value="150" style="width:70px"> palavras/min</label>
  <label>Fonte <input id="fonte" type="range" min="28" max="80" value="46"></label>
  <label><input id="legendas" type="checkbox" checked> Legendas "Tela" no vídeo</label>
  <button id="btnLivre">Texto próprio…</button>
  <button id="btnRec" class="rec">● Gravar (R)</button>
  <span class="help">Espaço: rolar/pausar · ← →: parágrafo · ↑ ↓: velocidade · R: gravar/parar</span>
</header>

<main id="prompter"><div id="guia"></div><div id="track"></div></main>

<aside>
  <canvas id="saida" width="1080" height="1920"></canvas>
  <div id="status">Permita câmera e microfone quando o navegador pedir.</div>
  <div id="downloads"></div>
</aside>

<div id="contagem"></div>
<div id="livre">
  <strong>Texto próprio</strong>
  <span style="color:#94a3b8;font-size:14px">Separe os parágrafos com uma linha em branco. Uma linha começando com <code>Tela:</code> vira a legenda do parágrafo anterior. Use [pausa] para marcar pausas.</span>
  <textarea id="txtLivre" placeholder="Primeiro parágrafo…&#10;Tela: legenda curta&#10;&#10;Segundo parágrafo…"></textarea>
  <div><button id="usarLivre">Usar este texto</button> <button id="fecharLivre">Cancelar</button></div>
</div>

<video id="cam" autoplay muted playsinline style="display:none"></video>

<script>
const ROTEIROS_MD = "/paradigma/50-comunicacao/canal/roteiros-shorts-x-vs-idd.md";
const SELO = "✅ CONCEITO · IDD na formulação de Eliézer Rosa";
const $ = id => document.getElementById(id);
const canvas = $("saida"), ctx = canvas.getContext("2d"), cam = $("cam");

let roteiros = [], atual = null, par = 0, rolando = false, inicioPar = 0, decorridoPar = 0;
let streamCam = null, streamMic = null, gravador = null, pedacos = [], gravando = false;

// ---------- roteiros ----------
function parseRoteiros(md) {
  const out = [];
  for (const sec of md.split(/^## /m).slice(1)) {
    const cab = sec.split("\n")[0].trim();
    const titulo = (sec.match(/\*\*Título:\*\*\s*(.+)/) || [, cab])[1].trim();
    const corpo = (sec.split("**Roteiro**")[1] || "").split("**Descrição**")[0];
    out.push({ nome: cab, titulo, pars: parsePars(corpo) });
  }
  return out;
}
function parsePars(texto) {
  const pars = [];
  for (const bloco of texto.split(/\n\s*\n/)) {
    const linhas = bloco.split("\n").map(l => l.trim()).filter(Boolean);
    if (!linhas.length) continue;
    const tela = linhas.find(l => /^\*?Tela:/i.test(l));
    const fala = linhas.filter(l => l !== tela).join(" ");
    const legenda = tela ? tela.replace(/^\*?Tela:\s*/i, "").replace(/\*$/, "").trim() : "";
    if (fala) pars.push({ fala, legenda });
    else if (legenda && pars.length) pars[pars.length - 1].legenda = legenda;
  }
  return pars;
}
function duracaoPar(p) {
  const palavras = p.fala.replace(/\[pausa\]/gi, "").split(/\s+/).filter(Boolean).length;
  const pausas = (p.fala.match(/\[pausa\]/gi) || []).length;
  return (palavras / Number($("wpm").value)) * 60000 + pausas * 900;
}
function carregar(r) {
  atual = r; par = 0; decorridoPar = 0; rolando = false;
  const track = $("track"); track.innerHTML = "";
  r.pars.forEach((p, i) => {
    const d = document.createElement("p"); d.className = "par"; d.dataset.i = i;
    d.innerHTML = p.fala.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\[pausa\]/gi, '<span class="pausa"> ⏸ </span>')
      + (p.legenda ? `<span class="tela">▣ ${p.legenda.replace(/</g, "&lt;")}</span>` : "");
    d.onclick = () => irPara(i);
    track.appendChild(d);
  });
  irPara(0);
}
function irPara(i) {
  if (!atual) return;
  par = Math.max(0, Math.min(atual.pars.length - 1, i));
  decorridoPar = 0; inicioPar = performance.now();
  document.querySelectorAll(".par").forEach(e => e.classList.toggle("atual", Number(e.dataset.i) === par));
  const alvo = document.querySelector(`.par[data-i="${par}"]`);
  $("track").style.transform = `translateY(${30 - alvo.offsetTop}px)`;
}
function alternarRolagem() {
  rolando = !rolando;
  if (rolando) inicioPar = performance.now() - decorridoPar; else decorridoPar = performance.now() - inicioPar;
}
setInterval(() => {
  if (!rolando || !atual) return;
  if (performance.now() - inicioPar >= duracaoPar(atual.pars[par])) {
    if (par < atual.pars.length - 1) irPara(par + 1);
    else { rolando = false; if (gravando) setTimeout(() => gravando && pararGravacao(), 1500); }
  }
}, 100);

// ---------- mídia ----------
async function iniciarMidia() {
  for (const s of [streamCam, streamMic]) s && s.getTracks().forEach(t => t.stop());
  streamCam = null;
  try {
    streamMic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    if ($("modo").value === "camera") {
      streamCam = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } } });
      cam.srcObject = streamCam; await cam.play();
    }
    $("status").textContent = "Pronto. Ajuste o enquadramento e aperte R para gravar.";
  } catch (e) {
    $("status").textContent = "Sem acesso à câmera/microfone: " + e.message;
  }
}
function quebrar(texto, larg) {
  const linhas = []; let l = "";
  for (const p of texto.split(" ")) {
    const t = l ? l + " " + p : p;
    if (ctx.measureText(t).width > larg && l) { linhas.push(l); l = p; } else l = t;
  }
  if (l) linhas.push(l);
  return linhas;
}
function caixaTexto(texto, y, tam, cor, fundo) {
  ctx.font = `700 ${tam}px "Segoe UI", sans-serif`;
  const linhas = quebrar(texto, 900), alt = linhas.length * tam * 1.25 + 40;
  ctx.fillStyle = fundo; ctx.beginPath(); ctx.roundRect(60, y, 960, alt, 28); ctx.fill();
  ctx.fillStyle = cor; ctx.textAlign = "center"; ctx.textBaseline = "top";
  linhas.forEach((ln, i) => ctx.fillText(ln, 540, y + 20 + i * tam * 1.25));
}
function desenhar() {
  const W = 1080, H = 1920;
  if (streamCam && cam.videoWidth) {
    const vw = cam.videoWidth, vh = cam.videoHeight, alvo = W / H;
    let sw = vw, sh = vh;
    if (vw / vh > alvo) sw = vh * alvo; else sh = vw / alvo;
    ctx.drawImage(cam, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, W, H);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0f172a"); g.addColorStop(1, "#1e1b4b");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (atual) caixaTexto(atual.titulo, 640, 76, "#f8fafc", "rgba(0,0,0,0)");
  }
  caixaTexto(SELO, 170, 34, "#fde68a", "rgba(15,23,42,.78)");
  const leg = atual && atual.pars[par] && atual.pars[par].legenda;
  if ($("legendas").checked && leg) caixaTexto(leg, 1180, 64, "#ffffff", "rgba(15,23,42,.82)");
  requestAnimationFrame(desenhar);
}

// ---------- gravação ----------
function tipoSuportado() {
  for (const t of ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"])
    if (MediaRecorder.isTypeSupported(t)) return t;
  return "";
}
async function iniciarGravacao() {
  if (!streamMic) await iniciarMidia();
  for (let n = 3; n > 0; n--) { $("contagem").style.display = "grid"; $("contagem").textContent = n; await new Promise(r => setTimeout(r, 1000)); }
  $("contagem").style.display = "none";
  const saida = new MediaStream([...canvas.captureStream(30).getVideoTracks(), ...streamMic.getAudioTracks()]);
  const tipo = tipoSuportado();
  gravador = new MediaRecorder(saida, { mimeType: tipo, videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 160_000 });
  pedacos = [];
  gravador.ondataavailable = e => e.data.size && pedacos.push(e.data);
  gravador.onstop = salvar;
  gravador.start(1000);
  gravando = true; canvas.classList.add("gravando");
  $("btnRec").textContent = "■ Parar (R)";
  $("status").textContent = "Gravando…";
  irPara(0); rolando = false; alternarRolagem();
}
function pararGravacao() {
  gravando = false; rolando = false;
  gravador && gravador.state !== "inactive" && gravador.stop();
  canvas.classList.remove("gravando");
  $("btnRec").textContent = "● Gravar (R)";
}
function salvar() {
  const tipo = gravador.mimeType || "video/webm", ext = tipo.includes("mp4") ? "mp4" : "webm";
  const blob = new Blob(pedacos, { type: tipo });
  const slug = (atual ? atual.nome : "gravacao").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const agora = new Date(), dois = n => String(n).padStart(2, "0");
  const carimbo = `${agora.getFullYear()}${dois(agora.getMonth() + 1)}${dois(agora.getDate())}-${dois(agora.getHours())}${dois(agora.getMinutes())}`;
  const nome = `short-${slug}-${carimbo}.${ext}`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nome; a.textContent = `⬇ ${nome} (${(blob.size / 1e6).toFixed(1)} MB)`;
  $("downloads").prepend(a); a.click();
  $("status").textContent = `Salvo em Downloads: ${nome}`;
  window.__ultimaGravacao = { nome, bytes: blob.size, tipo };
}

// ---------- interface ----------
$("btnRec").onclick = () => gravando ? pararGravacao() : iniciarGravacao();
$("modo").onchange = iniciarMidia;
$("fonte").oninput = e => { document.documentElement.style.setProperty("--fs", e.target.value + "px"); irPara(par); };
$("roteiro").onchange = e => carregar(roteiros[Number(e.target.value)]);
$("btnLivre").onclick = () => $("livre").style.display = "flex";
$("fecharLivre").onclick = () => $("livre").style.display = "none";
$("usarLivre").onclick = () => {
  const r = { nome: "texto-proprio", titulo: "", pars: parsePars($("txtLivre").value) };
  $("livre").style.display = "none";
  if (r.pars.length) carregar(r);
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" && e.target.type === "number") return;
  if (e.code === "Space") { e.preventDefault(); alternarRolagem(); }
  else if (e.key === "ArrowRight") irPara(par + 1);
  else if (e.key === "ArrowLeft") irPara(par - 1);
  else if (e.key === "ArrowUp") { e.preventDefault(); $("wpm").value = Number($("wpm").value) + 10; }
  else if (e.key === "ArrowDown") { e.preventDefault(); $("wpm").value = Number($("wpm").value) - 10; }
  else if (e.key.toLowerCase() === "r") $("btnRec").click();
});

(async () => {
  try {
    roteiros = parseRoteiros(await (await fetch(ROTEIROS_MD)).text());
    roteiros.forEach((r, i) => $("roteiro").add(new Option(r.nome, i)));
    if (roteiros.length) carregar(roteiros[0]);
  } catch (e) { $("status").textContent = "Não achei os roteiros; use “Texto próprio…”."; }
  requestAnimationFrame(desenhar);
  iniciarMidia();
})();
</script>
</body>
</html>
