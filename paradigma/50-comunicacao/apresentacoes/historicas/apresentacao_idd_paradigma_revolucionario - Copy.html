<style>

  * { box-sizing: border-box; }
  body {

    color: var(--fg);

  }

    flex-direction: column;

  }
  header {
    display: flex;

    align-items: center;

    margin-bottom: 18px;

    margin: 0;
    font-size: 18px;

    overflow: hidden;

  .text-pane {
    overflow-y: auto;
    padding-right: 20px;
  }
  .visual-pane {
    background: var(--paper);
    border-radius: 12px;

    font-size: 30px;

    color: var(--fg);
    font-weight: 600;
    line-height: 1.2;
  }
  .slide-subtitle {
    color: var(--accent);
    font-size: 15px;
    margin: 0 0 18px 0;
    font-weight: 500;

  .slide-text p { margin: 0 0 12px 0; }

    align-items: center;
    padding-top: 12px;
    margin-top: 12px;

  button {
    background: var(--bg-card);
    border: 1px solid var(--muted);
    color: var(--fg);

    border-radius: 6px;

      <p>O paradigma <strong>IDD — Intent-Driven Design</strong> inverte a equação: a máquina aprende a falar como humano. A <strong>conversa volta a ser a interface principal</strong>; tudo o mais é satélite, ferramenta, andaime.</p>

      <p>O dev clássico enfrenta uma maldição: cada caso de uso vira <strong>mais um botão</strong>. Em três anos de produto maduro, a interface é um cemitério de affordances. Tudo está lá; nada se acha.</p>

// ========= ENGINE: speech + nav =========
let current = 0;
let speaking = false;
let queue = [];

const $ = (id) => document.getElementById(id);
const synth = window.speechSynthesis;
let voices = [];

function loadVoices() {
  voices = synth.getVoices().filter(v => v.lang.startsWith('pt'));
  if (voices.length === 0) voices = synth.getVoices();
  const sel = $('voiceSel');
  sel.innerHTML = '';
  voices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(o);
  });
  // tenta selecionar voz natural pt-BR
  const preferred = voices.findIndex(v =>
    v.lang === 'pt-BR' && (v.name.includes('Natural') || v.name.includes('Francisca') || v.name.includes('Antonio'))
  );
  if (preferred >= 0) sel.value = preferred;
}
synth.addEventListener('voiceschanged', loadVoices);
loadVoices();

function speak(text, onEnd) {
  return new Promise((resolve) => {
    const u = new SpeechSynthesisUtterance(text);
    const sel = $('voiceSel');
    if (voices[sel.value]) u.voice = voices[sel.value];
    u.lang = 'pt-BR';
    u.rate = parseFloat($('rate').value);
    u.pitch = 1.0;
    u.onstart = () => { $('dot').classList.add('speaking'); $('statusText').textContent = 'Falando...'; };
    u.onend = () => { $('dot').classList.remove('speaking'); resolve(); if (onEnd) onEnd(); };
    u.onerror = () => { $('dot').classList.remove('speaking'); resolve(); };
    synth.speak(u);
  });
}

function htmlToSpeech(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent.replace(/\s+/g, ' ').trim();
}

function render(idx) {
  const s = SLIDES[idx];
  $('subtitle').textContent = s.subtitle;
  $('title').textContent = s.title;
  $('text').innerHTML = s.html;
  $('commentary').textContent = s.commentary;
  $('commentary').classList.remove('visible');
  $('counter').textContent = `${idx + 1} / ${SLIDES.length}`;
  const v = $('visual');
  v.innerHTML = '';
  if (s.diagram) s.diagram(v);
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === SLIDES.length - 1;
}

async function playCurrent() {
  if (speaking) return;
  speaking = true;
  $('play').textContent = '⏸ Falando...';
  const s = SLIDES[current];
  const slideText = `${s.title}. ${htmlToSpeech(s.html)}`;
  await speak(slideText);
  if (!speaking) { $('play').textContent = '▶ Tocar slide'; return; }
  // após texto principal, mostra e fala comentário
  $('commentary').classList.add('visible');
  await new Promise(r => setTimeout(r, 600));
  await speak('Comentário adicional. ' + s.commentary);
  speaking = false;
  $('play').textContent = '▶ Tocar slide';
  $('statusText').textContent = 'Pronto.';
  if ($('autoadvance').checked && current < SLIDES.length - 1) {
    setTimeout(() => { next(); playCurrent(); }, 1500);
  }
}

function stopSpeak() {
  speaking = false;
  synth.cancel();
  $('play').textContent = '▶ Tocar slide';
  $('dot').classList.remove('speaking');
  $('statusText').textContent = 'Parado.';
}

function next() { if (current < SLIDES.length - 1) { stopSpeak(); current++; render(current); } }
function prev() { if (current > 0) { stopSpeak(); current--; render(current); } }

$('play').onclick = playCurrent;
$('stop').onclick = stopSpeak;
$('next').onclick = next;
$('prev').onclick = prev;

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); speaking ? stopSpeak() : playCurrent(); }
  else if (e.key === 'Escape') stopSpeak();
});

render(0);
</script>
