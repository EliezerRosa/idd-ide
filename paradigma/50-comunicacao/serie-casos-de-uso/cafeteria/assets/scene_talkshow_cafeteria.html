<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>IDD Cafeteria & Padaria — Talk Show de Homologação (MER & UML)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      width: 1920px;
      height: 1080px;
      background: #0c0a09;
      color: #f5f5f4;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* BACKGROUND GRID & GLOW */
    .grid-bg {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(245, 158, 11, 0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(245, 158, 11, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    .ambient-glow {
      position: absolute;
      width: 1200px; height: 1200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.22) 0%, rgba(180, 83, 9, 0.12) 40%, transparent 70%);
      top: 40%; left: 50%; transform: translate(-50%, -50%);
      filter: blur(100px); pointer-events: none;
    }

    /* TOP BAR (BROADCAST HEADER) */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 75px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; background: rgba(28, 19, 14, 0.94);
      border-bottom: 1.5px solid rgba(245, 158, 11, 0.35);
      backdrop-filter: blur(14px); z-index: 50;
    }
    .top-left { display: flex; align-items: center; gap: 20px; }
    .badge-live {
      background: linear-gradient(135deg, #b45309, #d97706);
      color: white; font-weight: 800; font-size: 13px; letter-spacing: 1.5px;
      padding: 5px 14px; border-radius: 999px; text-transform: uppercase;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
      display: flex; align-items: center; gap: 8px;
    }
    .badge-live::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: #fbbf24; box-shadow: 0 0 10px #fbbf24;
      animation: pulseDot 1.4s infinite alternate;
    }
    @keyframes pulseDot { from { opacity: 0.4; } to { opacity: 1; } }

    .show-title { font-size: 20px; font-weight: 800; color: #f5f5f4; }
    .show-title span { color: #f59e0b; font-weight: 900; }
    .stage-indicator {
      font-size: 13px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fde68a; padding: 4px 14px; border-radius: 8px; font-weight: 700;
    }
    .top-clock {
      font-size: 18px; font-family: 'Consolas', monospace; color: #fbbf24;
      font-weight: 700; letter-spacing: 1px;
    }

    /* STAGE (PALCO PRINCIPAL) */
    .stage-container {
      position: absolute; top: 75px; bottom: 200px; left: 0; right: 0;
      overflow: hidden; background: #0c0a09;
    }
    .stage-frame {
      width: 100%; height: 100%; border: none;
      position: absolute; inset: 0;
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .stage-frame.active {
      opacity: 1; pointer-events: auto;
    }

    /* VIRTUAL HUMAN MOUSE OVERLAY */
    #virtual-mouse {
      position: absolute;
      top: 400px; left: 960px;
      width: 32px; height: 32px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-2px, -2px);
      transition: top 0.8s cubic-bezier(0.22, 1, 0.36, 1), left 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #virtual-mouse svg {
      width: 30px; height: 30px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.85)) drop-shadow(0 0 8px rgba(245, 158, 11, 0.7));
    }
    #click-ripple {
      position: absolute;
      top: 0; left: 0;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 3px solid #f59e0b;
      background: rgba(245, 158, 11, 0.35);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      z-index: 9998;
    }
    @keyframes rippleExpand {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
    }
    .rippling {
      animation: rippleExpand 0.6s ease-out forwards;
    }

    /* BOTTOM BAR (ESTÚDIO TALK SHOW & AVATARES) */
    .bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
      background: rgba(18, 12, 9, 0.96);
      border-top: 1.5px solid rgba(245, 158, 11, 0.35);
      backdrop-filter: blur(18px);
      display: grid;
      grid-template-columns: 560px 1fr;
      padding: 16px 40px;
      gap: 30px;
      align-items: center;
      z-index: 60;
    }

    /* AVATARES */
    .avatars-dock {
      display: flex; gap: 20px; align-items: center; justify-content: flex-start;
    }
    .avatar-card {
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.25s ease, filter 0.25s ease, opacity 0.25s ease;
      opacity: 0.65; transform: scale(0.92);
    }
    .avatar-card.talking {
      opacity: 1; transform: scale(1.05);
    }
    .avatar-ring {
      width: 84px; height: 84px; border-radius: 50%;
      padding: 3px; background: rgba(41, 29, 21, 0.8);
      border: 2px solid rgba(168, 162, 158, 0.3);
      position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.25s ease;
    }
    .avatar-ring img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    }
    .avatar-card.talking .avatar-ring {
      border-color: #fbbf24;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
      animation: ringGlow 1.2s infinite alternate;
    }
    #av-leigo.talking .avatar-ring {
      border-color: #f472b6;
      box-shadow: 0 0 25px rgba(244, 114, 182, 0.7);
    }
    #av-ia.talking .avatar-ring {
      border-color: #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
    }
    @keyframes ringGlow {
      from { transform: scale(1); filter: brightness(1); }
      to { transform: scale(1.06); filter: brightness(1.25); }
    }

    .avatar-info { text-align: center; margin-top: 6px; }
    .avatar-name { font-size: 13px; font-weight: 800; color: #f5f5f4; white-space: nowrap; }
    .avatar-role {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
      color: #a8a29e; white-space: nowrap; margin-top: 1px;
    }
    .avatar-card.talking .avatar-role { color: #fbbf24; }
    #av-leigo.talking .avatar-role { color: #f472b6; }
    #av-ia.talking .avatar-role { color: #38bdf8; }

    /* LEGENDA DINÂMICA */
    .caption-box {
      background: rgba(28, 19, 14, 0.88);
      border: 1.5px solid rgba(245, 158, 11, 0.3);
      border-radius: 16px;
      padding: 16px 24px;
      height: 140px;
      display: flex; flex-direction: column; justify-content: center;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
    }
    .caption-speaker-tag {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .caption-speaker-tag::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
    }
    .speaker-eliezer { color: #fbbf24; }
    .speaker-eliezer::before { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
    .speaker-leigo { color: #f472b6; }
    .speaker-leigo::before { background: #f472b6; box-shadow: 0 0 8px #f472b6; }
    .speaker-ia { color: #38bdf8; }
    .speaker-ia::before { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }

    .caption-text {
      font-size: 21px; font-weight: 600; line-height: 1.42; color: #f5f5f4;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    #black-curtain {
      position: absolute; inset: 0; background: #000; z-index: 99999;
      pointer-events: none; transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="black-curtain"></div>
  <div class="grid-bg"></div>
  <div class="ambient-glow"></div>

  <!-- CURSOR VIRTUAL HUMANIZADO -->
  <div id="virtual-mouse">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M4 3L11 20L14 13L21 10L4 3Z" fill="#fbbf24" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
  </div>
  <div id="click-ripple"></div>

  <!-- CABEÇALHO BROADCAST -->
  <header class="top-bar">
    <div class="top-left">
      <div class="badge-live">TALK SHOW AO VIVO</div>
      <div class="show-title">IDD NA PRÁTICA <span>• CAFETERIA &amp; PADARIA</span></div>
      <div class="stage-indicator" id="stageIndicator">Módulo 1: MER Canônico &amp; Invariante de Insumos</div>
    </div>
    <div class="top-clock" id="clockDisplay">00:00.0</div>
  </header>

  <!-- PALCO PRINCIPAL -->
  <main class="stage-container">
    <iframe id="frameMer" class="stage-frame active" src="../../docs/visualizar_mer_cafeteria.html"></iframe>
    <iframe id="frameUml" class="stage-frame" src="../../docs/visualizar_uml_cafeteria.html"></iframe>
  </main>

  <!-- BANCADA OFICIAL DE APRESENTADORES -->
  <footer class="bottom-bar">
    <div class="avatars-dock">
      <!-- LEIGA -->
      <div class="avatar-card" id="av-leigo">
        <div class="avatar-ring">
          <img src="../avatares/avatar_usuaria_leiga.png" alt="Usuária Leiga">
        </div>
        <div class="avatar-info">
          <div class="avatar-name">Usuária Leiga</div>
          <div class="avatar-role">Avaliadora de Negócio</div>
        </div>
      </div>

      <!-- ELIÉZER -->
      <div class="avatar-card talking" id="av-eliezer">
        <div class="avatar-ring">
          <img src="../avatares/avatar_eliezer_oficial.png" alt="Eliézer Rosa">
        </div>
        <div class="avatar-info">
          <div class="avatar-name">Eliézer Rosa</div>
          <div class="avatar-role">Orquestrador IDD</div>
        </div>
      </div>

      <!-- IA COMPILADOR -->
      <div class="avatar-card" id="av-ia">
        <div class="avatar-ring">
          <img src="../avatares/avatar_ia_compilador.png" alt="IA Compilador">
        </div>
        <div class="avatar-info">
          <div class="avatar-name">IA Compilador</div>
          <div class="avatar-role">Normalização &amp; Contratos</div>
        </div>
      </div>
    </div>

    <!-- CAIXA DE LEGENDAS -->
    <div class="caption-box">
      <div class="caption-speaker-tag speaker-eliezer" id="subSpeaker">Eliézer Rosa</div>
      <div class="caption-text" id="subText">Iniciando a homologação do aplicativo de Cafeteria &amp; Padaria...</div>
    </div>
  </footer>

  <script>
    let timelineItems = [];
    let isRunning = false;
    let startTimeMs = 0;
    let activeAction = null;

    window.setTimeline = function(items) {
      timelineItems = items;
    };

    window.startPresentation = function() {
      const curtain = document.getElementById('black-curtain');
      if (curtain) {
        curtain.style.opacity = '0';
        setTimeout(() => curtain.remove(), 80);
      }
      isRunning = true;
      startTimeMs = performance.now();
      requestAnimationFrame(renderLoop);
    };

    window.stopPresentation = function() {
      isRunning = false;
    };

    function moveMouseTo(x, y) {
      const mouse = document.getElementById('virtual-mouse');
      if (mouse) {
        mouse.style.left = x + 'px';
        mouse.style.top = y + 'px';
      }
    }

    function triggerClickRipple(x, y) {
      const ripple = document.getElementById('click-ripple');
      if (ripple) {
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.classList.remove('rippling');
        void ripple.offsetWidth;
        ripple.classList.add('rippling');
      }
    }

    function switchView(viewName) {
      const frameMer = document.getElementById('frameMer');
      const frameUml = document.getElementById('frameUml');
      const indicator = document.getElementById('stageIndicator');

      if (viewName === 'mer') {
        frameMer.classList.add('active');
        frameUml.classList.remove('active');
        if (indicator) indicator.innerText = 'Módulo 1: MER Canônico & Invariante de Insumos da Ficha Técnica';
      } else {
        frameUml.classList.add('active');
        frameMer.classList.remove('active');
        if (indicator) indicator.innerText = 'Módulo 2: Modelo UML Dinâmico & Statechart do KDS Cozinha';
      }
    }

    function interactWithUmlFrame(action) {
      const umlIframe = document.getElementById('frameUml');
      if (!umlIframe || !umlIframe.contentWindow) return;
      const doc = umlIframe.contentDocument || umlIframe.contentWindow.document;
      if (!doc) return;

      try {
        if (action === 'click_cliente') {
          const btn = doc.getElementById('btn-cliente');
          if (btn) btn.click();
        } else if (action === 'click_barista') {
          const btn = doc.getElementById('btn-barista');
          if (btn) btn.click();
        } else if (action === 'click_atendente') {
          const btn = doc.getElementById('btn-atendente');
          if (btn) btn.click();
        } else if (action === 'click_caixa') {
          const btn = doc.getElementById('btn-caixa');
          if (btn) btn.click();
        } else if (action === 'scroll_classes') {
          const sec = doc.querySelector('.container:nth-of-type(2)');
          if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (action === 'scroll_statechart') {
          const sec = doc.querySelector('.container:nth-of-type(3)');
          if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (action === 'reset_zoom') {
          const btn = doc.getElementById('btn-all');
          if (btn) btn.click();
          umlIframe.contentWindow.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } catch (err) {
        console.warn('Interação com frame UML Cafeteria:', err);
      }
    }

    // LOOP PRINCIPAL DE SINCRONISMO
    function renderLoop(now) {
      if (!isRunning) return;

      const elapsedSec = (now - startTimeMs) / 1000;
      const minutes = Math.floor(elapsedSec / 60);
      const seconds = (elapsedSec % 60).toFixed(1);
      document.getElementById('clockDisplay').innerText =
        String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(4, '0');

      const curSeg = timelineItems.find(item => elapsedSec >= item.startSec && elapsedSec < item.endSec);

      if (curSeg) {
        switchView(curSeg.stage || 'mer');

        ['leigo', 'eliezer', 'ia'].forEach(who => {
          const av = document.getElementById('av-' + who);
          if (av) {
            if (curSeg.who === who) av.classList.add('talking');
            else av.classList.remove('talking');
          }
        });

        const speakerEl = document.getElementById('subSpeaker');
        const textEl = document.getElementById('subText');
        speakerEl.className = 'caption-speaker-tag speaker-' + curSeg.who;
        speakerEl.innerText = curSeg.actor;
        textEl.innerText = curSeg.text;

        if (activeAction !== curSeg.id) {
          activeAction = curSeg.id;
          executeCafeteriaAction(curSeg);
        }
      }

      requestAnimationFrame(renderLoop);
    }

    function executeCafeteriaAction(seg) {
      switch (seg.action) {
        case 'point_header':
          moveMouseTo(600, 280);
          setTimeout(() => moveMouseTo(960, 360), 1500);
          break;

        case 'point_invariants_top':
          moveMouseTo(960, 720);
          setTimeout(() => triggerClickRipple(960, 720), 800);
          break;

        case 'point_mesa_balcao':
          moveMouseTo(960, 300);
          setTimeout(() => triggerClickRipple(960, 300), 900);
          break;

        case 'point_comanda':
          moveMouseTo(680, 420);
          setTimeout(() => triggerClickRipple(680, 420), 800);
          break;

        case 'point_ficha_tecnica':
          moveMouseTo(1150, 420);
          setTimeout(() => triggerClickRipple(1150, 420), 900);
          break;

        case 'point_baixa_insumo':
          moveMouseTo(960, 520);
          setTimeout(() => triggerClickRipple(960, 520), 800);
          break;

        case 'point_pagamento_fiscal':
          moveMouseTo(450, 680);
          setTimeout(() => triggerClickRipple(450, 680), 900);
          break;

        case 'switch_to_uml_cliente':
          switchView('uml');
          interactWithUmlFrame('click_cliente');
          moveMouseTo(220, 132);
          setTimeout(() => triggerClickRipple(220, 132), 600);
          setTimeout(() => moveMouseTo(800, 380), 1600);
          break;

        case 'point_qr_code_menu':
          moveMouseTo(1100, 450);
          setTimeout(() => triggerClickRipple(1100, 450), 800);
          break;

        case 'switch_to_uml_barista':
          moveMouseTo(420, 132);
          setTimeout(() => {
            triggerClickRipple(420, 132);
            interactWithUmlFrame('click_barista');
          }, 600);
          break;

        case 'point_kds_cozinha':
          moveMouseTo(960, 420);
          setTimeout(() => triggerClickRipple(960, 420), 800);
          break;

        case 'switch_to_uml_caixa':
          moveMouseTo(750, 132);
          setTimeout(() => {
            triggerClickRipple(750, 132);
            interactWithUmlFrame('click_caixa');
          }, 600);
          break;

        case 'point_nfce_caixa':
          moveMouseTo(960, 400);
          setTimeout(() => moveMouseTo(1150, 450), 1500);
          break;

        case 'scroll_to_classes_cafeteria':
          interactWithUmlFrame('scroll_classes');
          setTimeout(() => {
            moveMouseTo(960, 380);
            triggerClickRipple(960, 380);
          }, 800);
          break;

        case 'point_classes_core':
          moveMouseTo(1150, 480);
          setTimeout(() => triggerClickRipple(1150, 480), 800);
          break;

        case 'scroll_to_statechart_cafeteria':
          interactWithUmlFrame('scroll_statechart');
          setTimeout(() => {
            moveMouseTo(960, 480);
            triggerClickRipple(960, 480);
          }, 800);
          break;

        case 'point_statechart_kds':
          moveMouseTo(960, 680);
          setTimeout(() => triggerClickRipple(960, 680), 900);
          break;

        case 'conclude_cafeteria':
          moveMouseTo(960, 350);
          break;

        case 'approve_cafeteria':
          moveMouseTo(960, 450);
          setTimeout(() => triggerClickRipple(960, 450), 800);
          break;

        case 'farewell_cafeteria':
          interactWithUmlFrame('reset_zoom');
          moveMouseTo(960, 300);
          setTimeout(() => moveMouseTo(960, 450), 1800);
          break;

        default:
          break;
      }
    }
  </script>
</body>
</html>
