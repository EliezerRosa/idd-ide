name: Feature proposal
description: Propose a bounded, testable capability for IDD IDE.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: Describe the problem and intended outcome in domain language.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that prove the proposal is complete.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and invariants
      description: Include compatibility, security, performance, and governance constraints.
    validations:
      required: true