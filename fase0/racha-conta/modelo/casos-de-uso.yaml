atores:
  - nome: ResponsavelMesa
    tipo: humano
    descricao: Participante que cria e opera a mesa (inclui participantes, registra itens, fecha a mesa) e confirma os pagamentos dos demais.
  - nome: Participante
    tipo: humano
    descricao: Pessoa da mesa que consulta e paga a própria cota.
casos_de_uso:
  - id: UC-01
    nome: Criar mesa
    ator: ResponsavelMesa
    intencoes: [INT-005]
    transacoes:
      - id: TN-01
        nome: Criar mesa com chave Pix
        pre:
          - "O [[ResponsavelMesa]] informou a própria [[ChavePix]] e o próprio nome."
        pos:
          - "A [[Mesa]] existe, aberta, com a [[ChavePix]] do [[ResponsavelMesa]] e a [[TaxaServico]] informada, ou 10% se nenhuma foi informada."
          - "O [[ResponsavelMesa]] é um [[Participante]] da [[Mesa]]."
        invariantes: []
        altera: [Mesa, Participante]
        le: []
  - id: UC-02
    nome: Registrar participantes e consumo
    ator: ResponsavelMesa
    intencoes: [INT-001]
    transacoes:
      - id: TN-02
        nome: Incluir participante
        pre:
          - "A [[Mesa]] não está fechada."
          - "Nenhum [[Participante]] da [[Mesa]] tem o mesmo nome."
        pos:
          - "O novo [[Participante]] pertence a exatamente uma [[Mesa]]."
        invariantes: []
        altera: [Participante]
        le: [Mesa.fechada_em, Participante.nome]
      - id: TN-03
        nome: Registrar item com os consumidores
        pre:
          - "A [[Mesa]] não está fechada."
          - "O [[ItemConsumido]] tem ao menos um consumidor."
          - "Todo consumidor informado é [[Participante]] da mesma [[Mesa]] do [[ItemConsumido]]."
          - "O preço do [[ItemConsumido]] é um número inteiro de centavos."
        pos:
          - "O [[ItemConsumido]] recebe a próxima ordem de registro da [[Mesa]]."
          - "Existe exatamente um Consumo para cada consumidor informado."
        invariantes: [INV-003, INV-004]
        altera: [ItemConsumido, Consumo]
        le: [Mesa.fechada_em, Participante.mesa_id, ItemConsumido.ordem]
  - id: UC-03
    nome: Consultar a própria cota
    ator: Participante
    intencoes: [INT-001, INT-003]
    transacoes:
      - id: TN-04
        nome: Calcular as cotas da mesa
        pre:
          - "A [[Mesa]] tem ao menos um [[ItemConsumido]]."
        pos:
          - "O preço de cada [[ItemConsumido]] é dividido somente entre os [[Participante]]s que o consumiram."
          - "O centavo indivisível de cada [[ItemConsumido]] vai, em rodízio, para o próximo [[Participante]] em ordem alfabética que ainda não recebeu nenhum, percorrendo os itens na ordem de registro."
          - "O total da [[TaxaServico]] é o percentual da [[Mesa]] sobre a soma dos preços dos [[ItemConsumido]], com arredondamento comercial para centavos inteiros (meio centavo ou mais sobe)."
          - "A parte da [[TaxaServico]] de cada [[Participante]] é proporcional ao valor dos itens que ele consumiu; o centavo indivisível da taxa continua o rodízio alfabético a partir do [[Participante]] seguinte ao último que recebeu centavo dos itens."
          - "A soma das [[Cota]]s é exatamente igual à soma dos preços dos [[ItemConsumido]] mais a [[TaxaServico]]."
          - "Toda [[Cota]] é um número inteiro de centavos ≥ 0."
        invariantes: [INV-001, INV-005]
        altera: []
        le: [ItemConsumido.preco_centavos, ItemConsumido.ordem, Consumo, Participante.nome, Mesa.taxa_servico_percentual]
  - id: UC-04
    nome: Fechar mesa
    ator: ResponsavelMesa
    intencoes: []
    transacoes:
      - id: TN-05
        nome: Fechar a mesa para pagamento
        pre:
          - "A [[Mesa]] não está fechada."
        pos:
          - "A [[Mesa]] tem a data de fechamento e não aceita novos [[Participante]]s, novos [[ItemConsumido]]s nem mudanças nos consumos."
        invariantes: []
        altera: [Mesa.fechada_em]
        le: []
  - id: UC-05
    nome: Pagar a própria cota
    ator: Participante
    intencoes: [INT-004]
    transacoes:
      - id: TN-06
        nome: Gerar a cobrança Pix da cota
        pre:
          - "A [[Mesa]] está fechada."
          - "O [[Participante]] não é o [[ResponsavelMesa]]."
        pos:
          - "O aplicativo exibe o Pix Copia e Cola e o QR Code para a [[ChavePix]] da [[Mesa]], com o valor da [[Cota]] do [[Participante]]."
        invariantes: [INV-005]
        altera: []
        le: [Mesa.fechada_em, Mesa.chave_pix]
      - id: TN-07
        nome: Enviar comprovante
        pre:
          - "A [[Mesa]] está fechada."
          - "O [[Participante]] não é o [[ResponsavelMesa]]."
          - "Nenhum pagamento do [[Participante]] está confirmado."
        pos:
          - "Existe exatamente um pagamento do [[Participante]], com o comprovante e o valor da [[Cota]] em centavos no momento do envio; um comprovante anterior não confirmado é substituído."
        invariantes: []
        altera: [Pagamento]
        le: [Mesa.fechada_em, Pagamento.confirmado_em]
  - id: UC-06
    nome: Confirmar pagamento
    ator: ResponsavelMesa
    intencoes: []
    transacoes:
      - id: TN-08
        nome: Confirmar o pagamento de um participante
        pre:
          - "O pagamento tem comprovante e ainda não foi confirmado."
        pos:
          - "O pagamento tem a data de confirmação."
        invariantes: []
        altera: [Pagamento.confirmado_em]
        le: [Pagamento.comprovante_url]
